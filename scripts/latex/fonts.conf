<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Where the XeTeX of Foja's LaTeX worker looks for fonts by name: the ones Foja brings, and the template's own,
     which the editor writes among the template's files in /work. -->
<fontconfig>
  <dir>/texlive/texmf-dist/fonts/opentype</dir>
  <dir>/work</dir>
</fontconfig>
