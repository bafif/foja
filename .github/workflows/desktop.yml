# Builds the installers of the desktop app (apps/desktop) for the version in apps/desktop/package.json and leaves them
# on the draft release v<version>: a .deb, an .rpm and an AppImage for Linux, a setup .exe for Windows and a .dmg for
# macOS (Apple silicon and Intel in one). Manual only (Actions → Desktop installers → Run workflow). It creates the
# draft on the commit it ran on, or moves an existing draft there and replaces its installers; the release, and with
# it the tag, is published by hand. A version already published is refused. None of the installers is signed:
# .github/release-notes.md, the text of the release, says how to open them.
name: Desktop installers
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop
  cancel-in-progress: false
jobs:
  # The site the app wraps, built once: only Linux can make the LaTeX files (in a container). It goes to the other
  # jobs through the Actions cache.
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: scripts/latex-assets.sh
      - run: npm run build -w apps/web
        env:
          FOJA_DESKTOP: "1"
      - name: The draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if draft=$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::v$version is already published: raise the version in apps/desktop/package.json and apps/desktop/src-tauri/Cargo.toml"
              exit 1
            fi
            gh release edit "v$version" --target "$GITHUB_SHA" --notes-file .github/release-notes.md
          else
            gh release create "v$version" --draft --target "$GITHUB_SHA" --title "Foja $version" --notes-file .github/release-notes.md
          fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/dist
          key: desktop-site-${{ github.run_id }}
          enableCrossOsArchive: true
  installers:
    needs: site
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu GitHub offers: the AppImage runs on systems at least as new as the one it was built on.
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
            target: ""
          - os: windows-latest
            bundles: nsis
            target: ""
          - os: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git's bash on Windows too: PowerShell would swallow the `--` that hands options to npm and to Cargo.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/dist
          key: desktop-site-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: WebKitGTK and the rest of what Tauri builds against on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - name: Rust for both kinds of Mac
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci --no-fund --no-audit
      - name: Build
        run: npm run tauri -w apps/desktop -- build --ci --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -- --locked
      - name: The installers, on the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: apps/desktop/src-tauri/target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/bundle
        run: |
          files=$(find "$BUNDLE" -maxdepth 2 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*-setup.exe' -o -name '*.dmg' \))
          echo "$files"
          gh release upload "v${{ needs.site.outputs.version }}" --clobber $files
